[package]
name = "dx-demo"
version = "0.1.0"
edition = "2021"
description = "In-process simulator comparing Parlia with the DX two-phase consensus design"

[dependencies]
revm = { version = "38.0.0", default-features = false, features = ["std"] }
alloy-trie = { version = "0.9", features = ["ethereum"] }
alloy-primitives = { version = "1.5.6", features = ["rlp"] }
alloy-rlp = "0.3"
blst = "0.3.15"
ed25519-dalek = { version = "2.2", features = ["batch", "rand_core"] }
secp256k1 = { version = "0.30", features = ["recovery", "rand"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
